name: Release debug build

# Publishes the debug-signed APK (the "NextCraft Forge X" side-by-side build, shared debug key) as the latest GitHub
# release together with update-manifest.json, so Settings > "Periksa pembaruan aplikasi" can install it in place.
# Run it from the Actions tab (it must exist on the default branch to be dispatchable). The versionCode grows with
# every run, which is what the updater compares against the installed build.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Compute version
        run: |
          echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}-forge" >> "$GITHUB_ENV"
          echo "TAG=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
      - name: Prepare assets
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          apk="$(ls app/build/outputs/apk/debug/*.apk | head -1)"
          mkdir -p dist
          cp "$apk" "dist/nextcraft-forge-x-$VERSION_NAME.apk"
          NEXTCRAFT_OUT_DIR=dist scripts/make-update-manifest.sh \
            "dist/nextcraft-forge-x-$VERSION_NAME.apk" "$VERSION_CODE" "$VERSION_NAME" "$TAG" debug "$NOTES"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          gh release create "$TAG" dist/*.apk dist/update-manifest.json \
            --title "NextCraft Forge X $VERSION_NAME" --notes "$NOTES" --latest
