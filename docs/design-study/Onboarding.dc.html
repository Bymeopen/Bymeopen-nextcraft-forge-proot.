<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>body{margin:0;font-family:Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}a:hover{color:inherit}.bar{transition:width 600ms ease}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: {{bg}}; color: {{text}}; position: relative; overflow: hidden">
  <div style="height: 44px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 28px 6px; font-size: 14px; font-weight: 600"><span>4:16</span><span>82</span></div>
  <div style="flex: 1; display: flex; flex-direction: column; padding: 40px 24px 0">
    <div style="width: 56px; height: 56px; border-radius: 18px; background: {{accent}}; display: flex; align-items: center; justify-content: center; margin-bottom: 26px">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="{{onAccent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 6a4 4 0 005 5l-9 9-3-3 9-9"></path></svg>
    </div>
    <div style="font-size: 14px; color: {{muted}}">NextCraft Forge</div>
    <div style="font-size: 30px; font-weight: 600; line-height: 36px; margin-top: 4px">{{title}}</div>
    <div style="font-size: 15px; color: {{muted}}; line-height: 22px; margin: 10px 0 28px">{{body}}</div>
    <div style="border-radius: 18px; background: {{card}}; border: {{cardBorder}}; padding: 6px 4px; display: flex; flex-direction: column">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 6px 12px; box-sizing: border-box">
          <span style="width: 20px; height: 20px; border-radius: 50%; background: {{s.bg}}; border: 2px solid {{s.ring}}; box-sizing: border-box; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{s.glyph}}</span>
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15.5px; font-weight: 500; color: {{s.color}}">{{s.name}}</span><span style="font-size: 13px; color: {{muted}}">{{s.sub}}</span></span>
          <span style="font-size: 12.5px; color: {{muted}}">{{s.size}}</span>
        </div>
      </sc-for>
    </div>
    <sc-if value="{{installing}}" hint-placeholder-val="{{true}}">
      <div style="margin-top: 18px; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; font-size: 13px; color: {{muted}}"><span>{{progressLabel}}</span><span>{{percent}}%</span></div>
        <div style="height: 4px; border-radius: 2px; background: {{raised}}; overflow: hidden"><div class="bar" style="height: 4px; width: {{percent}}%; background: {{accent}}"></div></div>
      </div>
    </sc-if>
  </div>
  <div style="padding: 0 24px 34px; display: flex; flex-direction: column; gap: 10px">
    <button type="button" onClick="{{primary}}" style="height: 48px; border-radius: 24px; border: 0; background: {{accent}}; color: {{onAccent}}; font-family: inherit; font-size: 15.5px; font-weight: 600; cursor: pointer">{{cta}}</button>
    <sc-if value="{{showSkip}}" hint-placeholder-val="{{true}}">
      <a href="Projects.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14.5px; color: {{muted}}">Skip for now — install later from Settings › Runtime</a>
    </sc-if>
    <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
      <a href="Projects.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14.5px; color: {{muted}}">Go to Projects ›</a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["linear","system","white","glass"],"default":"linear","section":"Theme"},"stage":{"editor":"enum","options":["welcome","installing","done"],"default":"installing","section":"State"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const t = this.props.theme ?? 'linear';
    const P = {
      linear: { bg: '#0B0B0B', text: '#EDEDED', muted: '#9C9C9C', line: '#1E1E1E', ring: '#4A4A4A', accent: '#5E6AD2', onAccent: '#FFFFFF', card: '#131313', raised: '#1B1B1B', cardBorder: '0' },
      system: { bg: '#141218', text: '#E6E0E9', muted: '#CAC4D0', line: '#2B2930', ring: '#6F6B76', accent: '#D0BCFF', onAccent: '#381E72', card: '#211F26', raised: '#2B2930', cardBorder: '0' },
      white:  { bg: '#FFFFFF', text: '#111111', muted: '#666666', line: '#E4E4E4', ring: '#BDBDBD', accent: '#D70F47', onAccent: '#FFFFFF', card: '#F7F7F7', raised: '#EFEFEF', cardBorder: '0.5px solid #E4E4E4' },
      glass:  { bg: 'linear-gradient(160deg,#0D1326 0%,#1A1038 55%,#0B1B2E 100%)', text: '#FFFFFF', muted: '#C3C8DC', line: 'rgba(255,255,255,.12)', ring: '#7A81A0', accent: '#7C8CFF', onAccent: '#0B1030', card: 'rgba(255,255,255,.06)', raised: 'rgba(255,255,255,.10)', cardBorder: '1px solid rgba(255,255,255,.22)' },
    }[t];
    const stage = this.props.stage ?? 'installing';
    const yellow = '#F2C94C';
    const reached = { welcome: -1, installing: 1, done: 4 }[stage];
    const raw = [['Download rootfs', 'Ubuntu 24.04 minimal', '180 MB'], ['Extract', 'Into app private storage', '—'], ['Install JDK + Node', 'Needed for Gradle and Vite', '420 MB'], ['Verify', 'Runs a hello-world build', '—']];
    const steps = raw.map(([name, sub, size], i) => {
      const st = i < reached ? 'done' : (i === reached ? 'running' : 'todo');
      const m = { done: { bg: P.accent, ring: P.accent, glyph: '✓', color: P.text }, running: { bg: 'transparent', ring: yellow, glyph: '◐', color: P.text }, todo: { bg: 'transparent', ring: P.ring, glyph: '', color: P.muted } }[st];
      return { name, sub, size, ...m };
    });
    const copy = {
      welcome: ['Set up the runtime', 'Forge runs a real Linux shell on your phone. One-time setup, about 600 MB, no root needed.', 'Install runtime'],
      installing: ['Installing runtime', 'Keep the app open. You can switch themes while you wait.', 'Installing…'],
      done: ['Runtime ready', 'Your phone can now build Android apps and run dev servers.', 'Start building'],
    }[stage];
    return {
      ...P, steps,
      title: copy[0], body: copy[1], cta: copy[2],
      installing: stage === 'installing', done: stage === 'done', showSkip: stage === 'welcome',
      progressLabel: 'Extracting rootfs', percent: 38,
      primary: () => {},
    };
  }
}
</script>
</body>
</html>
