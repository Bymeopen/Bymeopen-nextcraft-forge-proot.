<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tools screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>body{margin:0;font-family:Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}a:hover{color:inherit}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: {{bg}}; color: {{text}}; position: relative; overflow: hidden">
  <div style="height: 44px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 28px 6px; font-size: 14px; font-weight: 600"><span>4:16</span><span>82</span></div>
  <div style="padding: 10px 20px 0; display: flex; flex-direction: column"><div style="font-size: 27px; font-weight: 600">Tools</div><div style="font-size: 14px; color: {{muted}}">my-todo-app</div></div>
  <div style="flex: 1; overflow: auto; padding: 14px 0 90px; display: flex; flex-direction: column">
    <div style="padding: 0 20px 6px; font-size: 13px; font-weight: 500; color: {{muted}}">Workspace</div>
    <sc-for list="{{tools}}" as="tl" hint-placeholder-count="3">
      <a href="{{tl.href}}" style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 10px 20px; box-sizing: border-box; border-bottom: 0.5px solid {{line}}">
        <span style="width: 36px; height: 36px; border-radius: 12px; background: {{raised}}; display: flex; align-items: center; justify-content: center">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: {{accent}}"><path d="{{tl.d}}"></path></svg>
        </span>
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 500">{{tl.title}}</span><span style="font-size: 13px; color: {{muted}}">{{tl.sub}}</span></span>
        <sc-if value="{{tl.badge}}" hint-placeholder-val="{{false}}"><span style="height: 22px; padding: 0 9px; border-radius: 11px; background: {{pillBg}}; display: flex; align-items: center; font-size: 12px; color: {{text}}">{{tl.badgeText}}</span></sc-if>
        <span style="font-size: 14px; color: {{muted}}">›</span>
      </a>
    </sc-for>
    <div style="padding: 22px 20px 6px; font-size: 13px; font-weight: 500; color: {{muted}}">Runtime</div>
    <div style="margin: 0 14px; border-radius: 18px; background: {{card}}; border: {{cardBorder}}; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 12px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #3DD68C"></span><span style="flex: 1; font-size: 15px; font-weight: 500">Root chroot ready</span><span style="font-size: 13px; color: {{muted}}">Ubuntu 24.04</span></div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{runtime}}" as="r" hint-placeholder-count="4">
          <span style="height: 28px; padding: 0 10px; border-radius: 14px; background: {{pillBg}}; display: flex; align-items: center; font-size: 12.5px; color: {{muted}}">{{r}}</span>
        </sc-for>
      </div>
    </div>
  </div>
  <a href="Main.dc.html" style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; background: {{barBg}}; display: flex; align-items: center; justify-content: center; font-size: 12px; color: {{muted}}; border-top: 0.5px solid {{line}}">Projects · Terminal · Agent · Tools · Settings — open Navigation for the live bar</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["linear","system","white","glass"],"default":"linear","section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const t = this.props.theme ?? 'linear';
    const P = {
      linear: { bg: '#0B0B0B', text: '#EDEDED', muted: '#9C9C9C', line: '#1E1E1E', ring: '#4A4A4A', accent: '#5E6AD2', card: '#131313', raised: '#1B1B1B', cardBorder: '0', barBg: '#131313', pillBg: 'rgba(255,255,255,.07)' },
      system: { bg: '#141218', text: '#E6E0E9', muted: '#CAC4D0', line: '#2B2930', ring: '#6F6B76', accent: '#D0BCFF', card: '#211F26', raised: '#2B2930', cardBorder: '0', barBg: '#211F26', pillBg: 'rgba(255,255,255,.08)' },
      white:  { bg: '#FFFFFF', text: '#111111', muted: '#666666', line: '#E4E4E4', ring: '#BDBDBD', accent: '#D70F47', card: '#F7F7F7', raised: '#EFEFEF', cardBorder: '0.5px solid #E4E4E4', barBg: '#F7F7F7', pillBg: 'rgba(0,0,0,.06)' },
      glass:  { bg: 'linear-gradient(160deg,#0D1326 0%,#1A1038 55%,#0B1B2E 100%)', text: '#FFFFFF', muted: '#C3C8DC', line: 'rgba(255,255,255,.12)', ring: '#7A81A0', accent: '#7C8CFF', card: 'rgba(255,255,255,.06)', raised: 'rgba(255,255,255,.10)', cardBorder: '1px solid rgba(255,255,255,.22)', barBg: 'rgba(255,255,255,.07)', pillBg: 'rgba(255,255,255,.10)' },
    }[t];
    const tools = [
      { title: 'Files', sub: 'Tree, changes, editor', href: 'Files.dc.html', d: 'M4 4h7l2 2h7v14H4z', badge: true, badgeText: '3 changed' },
      { title: 'Preview', sub: 'Open the dev server in-app', href: 'Launch.dc.html', d: 'M4 5h16v12H4zM9 21h6M12 17v4', badge: true, badgeText: ':3000' },
      { title: 'Android Builder', sub: 'Build, install and read logcat', href: 'Launch.dc.html', d: 'M7 10h10v8a2 2 0 01-2 2H9a2 2 0 01-2-2zM7 10a5 5 0 0110 0M9 6l-1-2M15 6l1-2', badge: false, badgeText: '' },
    ];
    return { ...P, tools, runtime: ['JDK 17', 'Node 20', 'Gradle 8.11', 'Android SDK 36'] };
  }
}
</script>
</body>
</html>
