<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Files screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>body{margin:0;font-family:Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}a:hover{color:inherit}.mono{font-family:"JetBrains Mono",ui-monospace,monospace}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: {{bg}}; color: {{text}}; position: relative; overflow: hidden">
  <div style="height: 44px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 28px 6px; font-size: 14px; font-weight: 600"><span>4:16</span><span>82</span></div>
  <div style="display: flex; align-items: center; padding: 10px 14px 0 20px; gap: 10px">
    <div style="flex: 1; display: flex; flex-direction: column"><div style="font-size: 27px; font-weight: 600">Files</div><div style="font-size: 14px; color: {{muted}}">my-todo-app · {{changedCount}} changed</div></div>
    <div style="height: 38px; border-radius: 19px; background: {{pillBg}}; display: flex; align-items: center; padding: 0 4px">
      <button type="button" onClick="{{openNew}}" aria-label="New file" style="width: 44px; height: 38px; border: 0; background: transparent; color: {{text}}; font-size: 20px; cursor: pointer; font-family: inherit">+</button>
      <button type="button" aria-label="Refresh" style="width: 44px; height: 38px; border: 0; background: transparent; color: {{text}}; font-size: 17px; cursor: pointer; font-family: inherit">↻</button>
    </div>
  </div>
  <div style="display: flex; gap: 6px; padding: 10px 14px 6px">
    <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="3">
      <button type="button" onClick="{{tb.pick}}" style="height: 34px; padding: 0 15px; border-radius: 17px; border: 0; background: {{tb.bg}}; color: {{tb.color}}; font-size: 15px; font-family: inherit; cursor: pointer">{{tb.name}}</button>
    </sc-for>
  </div>
  <div style="flex: 1; overflow: auto; padding-bottom: 90px">
    <sc-if value="{{showTree}}" hint-placeholder-val="{{true}}">
      <sc-for list="{{tree}}" as="f" hint-placeholder-count="8">
        <button type="button" onClick="{{f.pick}}" style="appearance: none; width: 100%; border: 0; background: {{f.bg}}; color: {{text}}; text-align: left; display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 6px 20px 6px {{f.indent}}; box-sizing: border-box; font-family: inherit; cursor: pointer">
          <span style="width: 18px; text-align: center; color: {{muted}}; font-size: 13px">{{f.glyph}}</span>
          <span class="mono" style="flex: 1; font-size: 14px; color: {{f.color}}">{{f.name}}</span>
          <sc-if value="{{f.changed}}" hint-placeholder-val="{{false}}"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{accent}}"></span></sc-if>
        </button>
      </sc-for>
    </sc-if>
    <sc-if value="{{showChanges}}" hint-placeholder-val="{{false}}">
      <sc-for list="{{changes}}" as="c" hint-placeholder-count="3">
        <a href="Agent.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 20px; border-bottom: 0.5px solid {{line}}; box-sizing: border-box">
          <span class="mono" style="width: 18px; font-size: 13px; font-weight: 500; color: {{c.color}}">{{c.kind}}</span>
          <span style="flex: 1; display: flex; flex-direction: column; min-width: 0"><span class="mono" style="font-size: 14px">{{c.name}}</span><span style="font-size: 12.5px; color: {{muted}}">{{c.path}}</span></span>
          <span class="mono" style="font-size: 12px; color: {{muted}}">{{c.delta}}</span>
        </a>
      </sc-for>
      <div style="display: flex; gap: 8px; padding: 14px 14px 0">
        <button type="button" style="flex: 1; height: 44px; border-radius: 22px; border: 1px solid {{ring}}; background: transparent; color: {{text}}; font-family: inherit; font-size: 15px; cursor: pointer">Discard all</button>
        <button type="button" style="flex: 1; height: 44px; border-radius: 22px; border: 0; background: {{accent}}; color: {{onAccent}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Commit…</button>
      </div>
    </sc-if>
    <sc-if value="{{showEditor}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; align-items: center; gap: 10px; padding: 4px 20px 8px; font-size: 13px; color: {{muted}}"><span class="mono" style="color: {{text}}">{{openFile}}</span><span style="flex: 1"></span><span>Kotlin · UTF-8</span></div>
      <div class="mono" style="margin: 0 14px; padding: 14px; border-radius: 16px; background: {{term}}; color: {{termText}}; font-size: 12.5px; line-height: 18px; white-space: pre; overflow: auto; min-height: 380px">{{code}}</div>
      <div style="display: flex; gap: 8px; padding: 12px 14px 0">
        <button type="button" style="flex: 1; height: 44px; border-radius: 22px; border: 1px solid {{ring}}; background: transparent; color: {{text}}; font-family: inherit; font-size: 15px; cursor: pointer">Revert</button>
        <button type="button" style="flex: 1; height: 44px; border-radius: 22px; border: 0; background: {{accent}}; color: {{onAccent}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Save</button>
      </div>
    </sc-if>
  </div>
  <sc-if value="{{newOpen}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 5">
      <div style="width: 330px; border-radius: 22px; background: {{dialogBg}}; border: {{cardBorder}}; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 48px rgba(0,0,0,.45)">
        <div style="font-size: 19px; font-weight: 600">New file</div>
        <div style="font-size: 14px; color: {{muted}}">Path is relative to the project root.</div>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: {{muted}}">Path<input type="text" value="app/src/main/java/Todo.kt" style="height: 44px; border-radius: 12px; border: 1px solid {{ring}}; background: transparent; color: {{text}}; padding: 0 12px; font-family: 'JetBrains Mono', monospace; font-size: 13.5px; outline: 0"></label>
        <div style="display: flex; gap: 8px; justify-content: flex-end">
          <button type="button" onClick="{{closeNew}}" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 0; background: transparent; color: {{muted}}; font-family: inherit; font-size: 15px; cursor: pointer">Cancel</button>
          <button type="button" onClick="{{closeNew}}" style="height: 40px; padding: 0 18px; border-radius: 20px; border: 0; background: {{accent}}; color: {{onAccent}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Create</button>
        </div>
      </div>
    </div>
  </sc-if>
  <a href="Tools.dc.html" style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; background: {{barBg}}; display: flex; align-items: center; justify-content: center; font-size: 12px; color: {{muted}}; border-top: 0.5px solid {{line}}">‹ Back goes to Tools — open Navigation for the live bar</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["linear","system","white","glass"],"default":"linear","section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 0, open: 'TodoList.kt', newOpen: false }; }
  renderVals() {
    const t = this.props.theme ?? 'linear';
    const P = {
      linear: { bg: '#0B0B0B', text: '#EDEDED', muted: '#9C9C9C', line: '#1E1E1E', ring: '#4A4A4A', accent: '#5E6AD2', onAccent: '#FFFFFF', card: '#131313', raised: '#1B1B1B', cardBorder: '0', barBg: '#131313', pillBg: 'rgba(255,255,255,.07)', term: '#070707', termText: '#E6E6E6', dialogBg: '#181818' },
      system: { bg: '#141218', text: '#E6E0E9', muted: '#CAC4D0', line: '#2B2930', ring: '#6F6B76', accent: '#D0BCFF', onAccent: '#381E72', card: '#211F26', raised: '#2B2930', cardBorder: '0', barBg: '#211F26', pillBg: 'rgba(255,255,255,.08)', term: '#0F0D13', termText: '#E6E0E9', dialogBg: '#2B2930' },
      white:  { bg: '#FFFFFF', text: '#111111', muted: '#666666', line: '#E4E4E4', ring: '#BDBDBD', accent: '#D70F47', onAccent: '#FFFFFF', card: '#F7F7F7', raised: '#EFEFEF', cardBorder: '0.5px solid #E4E4E4', barBg: '#F7F7F7', pillBg: 'rgba(0,0,0,.06)', term: '#F3F3F3', termText: '#222222', dialogBg: '#FFFFFF' },
      glass:  { bg: 'linear-gradient(160deg,#0D1326 0%,#1A1038 55%,#0B1B2E 100%)', text: '#FFFFFF', muted: '#C3C8DC', line: 'rgba(255,255,255,.12)', ring: '#7A81A0', accent: '#7C8CFF', onAccent: '#0B1030', card: 'rgba(255,255,255,.06)', raised: 'rgba(255,255,255,.10)', cardBorder: '1px solid rgba(255,255,255,.22)', barBg: 'rgba(255,255,255,.07)', pillBg: 'rgba(255,255,255,.10)', term: 'rgba(7,10,20,.58)', termText: '#F8FAFC', dialogBg: '#1A1F3A' },
    }[t];
    const tab = this.state.tab;
    const tabs = ['Tree', 'Changes (3)', 'Editor'].map((name, i) => ({ name, bg: i === tab ? P.pillBg : 'transparent', color: i === tab ? P.text : P.muted, pick: () => this.setState({ tab: i }) }));
    const treeRaw = [
      ['app', 0, true, false], ['src', 1, true, false], ['main', 2, true, false], ['java', 3, true, false],
      ['MainActivity.kt', 4, false, false], ['TodoList.kt', 4, false, true], ['TodoItem.kt', 4, false, true],
      ['res', 3, true, false], ['build.gradle.kts', 1, false, true], ['README.md', 0, false, false],
    ];
    const tree = treeRaw.map(([name, depth, dir, changed]) => ({
      name, changed, glyph: dir ? '▾' : '·', indent: (20 + depth * 16) + 'px',
      color: dir ? P.muted : P.text,
      bg: name === this.state.open ? P.pillBg : 'transparent',
      pick: () => { if (!dir) this.setState({ open: name, tab: 2 }); },
    }));
    const changes = [
      { kind: 'M', name: 'TodoList.kt', path: 'app/src/main/java', delta: '+18 −4', color: '#F2C94C' },
      { kind: 'A', name: 'TodoItem.kt', path: 'app/src/main/java', delta: '+42', color: '#3DD68C' },
      { kind: 'M', name: 'build.gradle.kts', path: 'app', delta: '+1', color: '#F2C94C' },
    ];
    const code = `@Composable
fun TodoList(items: List<Todo>, onDelete: (Todo) -> Unit) {
    LazyColumn {
        items(items, key = { it.id }) { todo ->
            Row(Modifier.fillMaxWidth()) {
                Text(todo.title, Modifier.weight(1f))
                IconButton(onClick = { onDelete(todo) }) {
                    Icon(Icons.Outlined.Delete, null)
                }
            }
        }
    }
}`;
    return {
      ...P, tabs, tree, changes, code,
      changedCount: 3, openFile: this.state.open,
      showTree: tab === 0, showChanges: tab === 1, showEditor: tab === 2,
      newOpen: this.state.newOpen,
      openNew: () => this.setState({ newOpen: true }), closeNew: () => this.setState({ newOpen: false }),
    };
  }
}
</script>
</body>
</html>
